[project]
name = "whoop-local-tools"
version = "0.1.0"
description = "Reproducible private-data tooling for the WHOOP iOS app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography==46.0.3",
    "numpy==2.3.5",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["ToolsTests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "Tools"
files = ["Tools", "ToolsTests"]
