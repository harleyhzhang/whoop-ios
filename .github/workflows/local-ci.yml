name: Local CI

on:
  # Use the trusted default-branch workflow definition for pull requests so a
  # proposed workflow edit cannot reorder the self-hosted safety check.
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  # pull_request_target uses the default branch as github.ref. Include the
  # event and PR number so a new PR cannot cancel verification of main.
  group: local-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local quality gate
    # Required jobs must not have an actor-level condition: GitHub treats a
    # skipped job as successful for branch protection.
    runs-on: [self-hosted, macOS, ARM64, whoop-ci]
    timeout-minutes: 20
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      # pull_request_target starts from the protected base workflow. Check out
      # that base revision first so the policy itself cannot come from the PR.
      - name: Check out trusted pull-request policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check out trusted source
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Reject untrusted self-hosted execution
        env:
          CI_ACTOR: ${{ github.actor }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CI_PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          CI_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          files_json=""
          if [ "$CI_EVENT_NAME" = "pull_request_target" ] && [ "$CI_PR_AUTHOR" = "dependabot[bot]" ]; then
            files_json="$RUNNER_TEMP/dependabot-pr-files.json"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$CI_REPOSITORY/pulls/$CI_PR_NUMBER/files?per_page=100" \
              >"$files_json"
          fi
          Tools/check_self_hosted_ci_trust.sh "$files_json"

      - name: Check out trusted pull-request revision
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run canonical pull-request verification
        if: github.event_name != 'push'
        run: Tools/verify_local.sh

      - name: Reuse exact pull-request result or verify main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --frozen python Tools/check_main_ci_reuse.py
          reuse_status=$?
          set -e
          if [ "$reuse_status" -eq 0 ]; then
            exit 0
          fi
          if [ "$reuse_status" -ne 75 ]; then
            exit "$reuse_status"
          fi
          echo "No exact trusted PR result; running the canonical gate."
          Tools/verify_local.sh
