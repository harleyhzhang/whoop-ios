name: iOS CI

on:
  # Hosted macOS runners are an explicit fallback. Normal verification runs
  # locally via Tools/verify_local.sh so ordinary pushes consume no Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      WHOOP_HISTORY_SEED_PATH: /tmp/missing-whoop-history.json
      WHOOP_SCORE_MODEL_PATH: /tmp/missing-whoop-score-model.json
      WHOOP_RECOVERY_MODEL_PATH: /tmp/missing-whoop-recovery-model.json
      WHOOP_OFFICIAL_METRICS_PATH: /tmp/missing-whoop-official-metrics.json
      WHOOP_OFFICIAL_ARCHIVE_PATH: /tmp/missing-whoop-official-archive.sqlite3

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned local tooling
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          brew bundle --file Brewfile

      - name: Run canonical verification
        run: Tools/verify_local.sh
