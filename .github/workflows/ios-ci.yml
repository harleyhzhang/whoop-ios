name: iOS CI

on:
  # Hosted macOS runners are an explicit fallback. Normal verification runs
  # locally via Tools/verify_local.sh so ordinary pushes consume no Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      WHOOP_HISTORY_SEED_PATH: /tmp/missing-whoop-history.json
      WHOOP_SCORE_MODEL_PATH: /tmp/missing-whoop-score-model.json
      WHOOP_RECOVERY_MODEL_PATH: /tmp/missing-whoop-recovery-model.json
      WHOOP_OFFICIAL_METRICS_PATH: /tmp/missing-whoop-official-metrics.json
      WHOOP_OFFICIAL_ARCHIVE_PATH: /tmp/missing-whoop-official-archive.sqlite3

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Reject private runtime data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(sleep\.sqlite3|whoop-history\.json|whoop-score-model\.json|whoop-recovery-model\.json|whoop-official-metrics\.json|whoop-official-archive\.sqlite3)$'; then
            echo "Private WHOOP runtime data must not be committed."
            exit 1
          fi

      - name: Run unit tests
        run: |
          xcodebuild test -quiet \
            -project Sleep.xcodeproj \
            -scheme Sleep \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/SleepDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SleepTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build -quiet \
            -project Sleep.xcodeproj \
            -scheme Sleep \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SleepDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failing test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SleepTests-${{ github.run_id }}
          path: ${{ runner.temp }}/SleepTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
