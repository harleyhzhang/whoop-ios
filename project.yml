name: Sleep
options:
  bundleIdPrefix: com.clintonst.sideload
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.7.1
targets:
  Sleep:
    type: application
    platform: iOS
    sources:
      - path: SleepApp
      - path: WhoopHandshakeApp/HandshakeView.swift
      - path: WhoopHandshakeApp/WhoopBluetoothPolicy.swift
      - path: WhoopHandshakeApp/WhoopHandshakeProbe.swift
      - path: WhoopHandshakeApp/WhoopStore.swift
    postBuildScripts:
      - name: Embed private WHOOP history
        basedOnDependencyAnalysis: false
        script: |
          SEED_PATH="${WHOOP_HISTORY_SEED_PATH:-${HOME}/Documents/personal/data/whoop/app-seeds/whoop-history.json}"
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-history.json"
          if [ -f "${SEED_PATH}" ] && ! /usr/bin/cmp -s "${SEED_PATH}" "${DESTINATION}"; then
            /bin/cp "${SEED_PATH}" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-history.json"
          elif [ ! -f "${SEED_PATH}" ]; then
            /bin/rm -f "${DESTINATION}"
          fi
          MODEL_PATH="${WHOOP_SCORE_MODEL_PATH:-${HOME}/Documents/personal/data/whoop/app-seeds/whoop-score-model.json}"
          MODEL_DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-score-model.json"
          if [ -f "${MODEL_PATH}" ] && ! /usr/bin/cmp -s "${MODEL_PATH}" "${MODEL_DESTINATION}"; then
            /bin/cp "${MODEL_PATH}" "${MODEL_DESTINATION}"
          elif [ ! -f "${MODEL_PATH}" ]; then
            /bin/rm -f "${MODEL_DESTINATION}"
          fi
          RECOVERY_MODEL_PATH="${WHOOP_RECOVERY_MODEL_PATH:-${HOME}/Documents/personal/data/whoop/app-seeds/whoop-recovery-model.json}"
          RECOVERY_MODEL_DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-recovery-model.json"
          if [ -f "${RECOVERY_MODEL_PATH}" ] && ! /usr/bin/cmp -s "${RECOVERY_MODEL_PATH}" "${RECOVERY_MODEL_DESTINATION}"; then
            /bin/cp "${RECOVERY_MODEL_PATH}" "${RECOVERY_MODEL_DESTINATION}"
          elif [ ! -f "${RECOVERY_MODEL_PATH}" ]; then
            /bin/rm -f "${RECOVERY_MODEL_DESTINATION}"
          fi
          OFFICIAL_METRICS_PATH="${WHOOP_OFFICIAL_METRICS_PATH:-${HOME}/Documents/personal/data/whoop/app-seeds/whoop-official-metrics.json}"
          OFFICIAL_METRICS_DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-official-metrics.json"
          if [ -f "${OFFICIAL_METRICS_PATH}" ] && ! /usr/bin/cmp -s "${OFFICIAL_METRICS_PATH}" "${OFFICIAL_METRICS_DESTINATION}"; then
            /bin/cp "${OFFICIAL_METRICS_PATH}" "${OFFICIAL_METRICS_DESTINATION}"
          elif [ ! -f "${OFFICIAL_METRICS_PATH}" ]; then
            /bin/rm -f "${OFFICIAL_METRICS_DESTINATION}"
          fi
          OFFICIAL_ARCHIVE_PATH="${WHOOP_OFFICIAL_ARCHIVE_PATH:-${HOME}/Documents/personal/data/whoop/app-seeds/whoop-official-archive.sqlite3}"
          OFFICIAL_ARCHIVE_DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whoop-official-archive.sqlite3"
          if [ -f "${OFFICIAL_ARCHIVE_PATH}" ] && ! /usr/bin/cmp -s "${OFFICIAL_ARCHIVE_PATH}" "${OFFICIAL_ARCHIVE_DESTINATION}"; then
            /bin/cp "${OFFICIAL_ARCHIVE_PATH}" "${OFFICIAL_ARCHIVE_DESTINATION}"
          elif [ ! -f "${OFFICIAL_ARCHIVE_PATH}" ]; then
            /bin/rm -f "${OFFICIAL_ARCHIVE_DESTINATION}"
          fi
          if [ "${CONFIGURATION}" = "Release" ] && [ "${PLATFORM_NAME}" = "iphoneos" ]; then
            if [ ! -f "${DESTINATION}" ] || [ ! -f "${MODEL_DESTINATION}" ] || [ ! -f "${RECOVERY_MODEL_DESTINATION}" ] || [ ! -f "${OFFICIAL_METRICS_DESTINATION}" ] || [ ! -f "${OFFICIAL_ARCHIVE_DESTINATION}" ]; then
              echo "error: Personal WHOOP device releases require the private history, models, and official raw archive."
              exit 1
            fi
          fi
    info:
      path: SleepApp/Info.plist
      properties:
        CFBundleDisplayName: WHOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: Establish a local encrypted link to your WHOOP strap and read live measurements.
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep
        PRODUCT_NAME: WHOOP
        PRODUCT_MODULE_NAME: Sleep
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WM8M9CQZF8
    scheme:
      testTargets:
        - SleepTests
        - SleepUITests
  SleepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepTests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WHOOP.app/WHOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SleepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SleepUITests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.ui-tests
        TEST_TARGET_NAME: Sleep
  SleepPrivateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepPrivateTests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.private-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WHOOP.app/WHOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
    scheme:
      testTargets:
        - SleepPrivateTests
