name: Sleep
options:
  bundleIdPrefix: com.clintonst.sideload
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.7.1
targets:
  Sleep:
    type: application
    platform: iOS
    sources:
      - path: SleepApp
      - path: WhoopHandshakeApp
    postBuildScripts:
      - name: Embed private WHOOP history
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/Tools/embed_private_assets.sh"
    info:
      path: SleepApp/Info.plist
      properties:
        CFBundleDisplayName: WHOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WHOOPSourceCommit: "$(WHOOP_SOURCE_COMMIT)"
        NSBluetoothAlwaysUsageDescription: Establish a local encrypted link to your WHOOP strap and read live measurements.
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep
        PRODUCT_NAME: WHOOP
        PRODUCT_MODULE_NAME: Sleep
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WM8M9CQZF8
    scheme:
      testTargets:
        - SleepTests
        - SleepUITests
  SleepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepTests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WHOOP.app/WHOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SleepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SleepUITests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.ui-tests
        TEST_TARGET_NAME: Sleep
  SleepPrivateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepPrivateTests
    dependencies:
      - target: Sleep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clintonst.sideload.sleep.private-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WHOOP.app/WHOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
    scheme:
      testTargets:
        - SleepPrivateTests
